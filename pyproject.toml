[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kavernis-fw"
version = "0.1.0"
description = "Declarative Linux firewall and network management platform"
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1,<4.0",
  "pydantic>=2.0,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
kavernis = "kavernis.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.0",
  "pytest>=8.0",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/kavernis"]
include = ["backend/kavernis/templates/**/*.j2"]

[tool.hatch.build.targets.sdist]
include = [
  "/backend/kavernis/templates/**/*.j2",
  "/backend",
  "/configs",
  "/schemas",
  "/tests",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["backend/kavernis"]
strict = true
